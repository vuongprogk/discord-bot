stages:
  - build
  - security
  - deploy
variables:
  SECRET_DETECTION_ENABLED: 'true'
  IMAGE_REPO: $REGISTRY_USER/$CI_PROJECT_NAME
  IMAGE_TAG: $REGISTRY/$REGISTRY_USER/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $REGISTRY/$REGISTRY_USER/$CI_PROJECT_NAME:latest
  IMAGE_CACHE: $REGISTRY/$REGISTRY_USER/$CI_PROJECT_NAME:buildcache
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: auto
  DOCKER_CLI_EXPERIMENTAL: enabled
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

build:
  stage: build
  image: vuongprogk/build:v1-alpine
  services:
    - name: docker:28.3.0-dind-alpine3.22
      command: ["--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1

  cache:
    - key: "docker-cache"
      paths:
        - .docker-cache/
  before_script:
    - echo "🔧 Waiting for Docker daemon..."
    - |
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "✅ Docker is ready!"
          break
        fi
        echo "⏳ Waiting..."
        sleep 2
      done
    - echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
    - docker pull "$IMAGE_CACHE" || true
  script:
    - docker buildx create --use
    - |
      docker buildx build \
        --platform=linux/amd64 \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from=type=registry,ref=$IMAGE_CACHE \
        --cache-from=type=local,src=.docker-cache \
        --cache-to=type=registry,ref=$IMAGE_CACHE,mode=min,oci-mediatypes=true \
        --cache-to=type=local,dest=.docker-cache-new,mode=max \
        --tag $IMAGE_TAG \
        --tag $IMAGE_LATEST \
        --push \
        -f ./Dockerfile .
    - mv .docker-cache-new .docker-cache
  only:
    - main

security-scan:
  stage: security
  needs: [build]
  image: aquasec/trivy:latest
  variables:
    TRIVY_NON_SSL: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: .trivycache
  before_script:
    - apk add --no-cache jq
    - echo "$REGISTRY_PASS" | trivy registry login --username "$REGISTRY_USER" --password-stdin  $REGISTRY 
  script:
    -  |
      echo "🔍 Running security scan on image: $IMAGE_TAG"

    # Human-readable vulnerability report
    - trivy image --format table --exit-code 0 --severity HIGH,CRITICAL "$IMAGE_TAG"

    # JSON report for artifacts
    - trivy image --format json --output trivy-report.json "$IMAGE_TAG"

    # Extract CRITICAL vulnerability count
    - CRITICAL_COUNT=$(trivy image --quiet --format json "$IMAGE_TAG" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
    - |
      echo "Critical vulnerabilities found: $CRITICAL_COUNT"
  artifacts:
    name: "security-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  only:
    - main

deploy:
  stage: deploy
  image: vuongprogk/deploy:v1-alpine
  needs:
    - build
    - security-scan
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
  script:
    - |
      export APP_NAME="${CI_PROJECT_NAME//_/-}"
      export REPLICAS=1

      echo "Deploying: $CI_PROJECT_NAME"
      export IMAGE_TAG=$IMAGE_TAG
      export NAMESPACE=personal

      envsubst < k8s/deployment.yaml | kubectl apply -f - || exit 1
      #envsubst < k8s/service.yaml | kubectl apply -f - || exit 1
      #envsubst < k8s/configmap.yaml | kubectl apply -f - || exit 1

      kubectl rollout status deployment/$APP_NAME --timeout=60s -n $NAMESPACE || {
        echo "Deployment failed. Events:"
        kubectl get events --sort-by='.metadata.creationTimestamp'
        exit 1
      }
      exit 0
  only:
    - main

