stages:
  - build
  - security
  - deploy
variables:
  IMAGE_REPO: $REGISTRY_USER/$CI_PROJECT_NAME
  IMAGE_TAG: $REGISTRY/$REGISTRY_USER/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $REGISTRY/$REGISTRY_USER/$CI_PROJECT_NAME:latest
  IMAGE_CACHE: $REGISTRY/$REGISTRY_USER/$CI_PROJECT_NAME:buildcache
  FF_USE_FASTZIP: "true"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_INLINE_CACHE: "1"

build:
  stage: build
  image: 
    name: moby/buildkit:buildx-stable-1-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASS\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --export-cache type=registry,ref=$IMAGE_CACHE,mode=min,compression=zstd,oci-mediatypes=true \
        --import-cache type=registry,ref=$IMAGE_CACHE \
        --output type=image,name=$IMAGE_TAG,push=true,compression=zstd,oci-mediatypes=true \
        --output type=image,name=$IMAGE_LATEST,push=true,compression=zstd,oci-mediatypes=true
  only:
    - main

security-scan:
  stage: security
  needs: [build]
  image: aquasec/trivy:0.67.2-amd64
  variables:
    TRIVY_NON_SSL: "true"
    TRIVY_NO_PROGRESS: "true"
    # Use in-memory cache for faster scans
    TRIVY_CACHE_DIR: "/tmp/trivy-cache"
    # Skip Java DB to reduce download size
    TRIVY_SKIP_JAVA_DB_UPDATE: "true"
  before_script:
    - apk add --no-cache jq
    - mkdir -p ~/.docker /tmp/trivy-cache
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_PASS\"}}}" > ~/.docker/config.json
  script:
    - echo "Running security scan on $IMAGE_TAG"
    # Single scan command - let Trivy handle DB download once
    - |
      trivy image \
        --format table \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --scanners vuln \
        --timeout 10m \
        "$IMAGE_TAG" || true
    - |
      trivy image \
        --format json \
        --output trivy-report.json \
        --severity HIGH,CRITICAL \
        --scanners vuln \
        --skip-db-update \
        "$IMAGE_TAG" || echo '{"Results":[]}' > trivy-report.json
    - test -f trivy-report.json && echo "Report file created" || echo "Warning - report missing"
    - |
      if [ -f trivy-report.json ]; then
        CRITICAL_COUNT=$(cat trivy-report.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' 2>/dev/null || echo "0")
        echo "Critical vulnerabilities - $CRITICAL_COUNT"
      fi
  artifacts:
    name: "security-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  only:
    - main

deploy:
  stage: deploy
  image: vuongprogk/deploy:v1-alpine
  needs:
    - build
    - security-scan
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
  script:
    - |
      export APP_NAME="${CI_PROJECT_NAME//_/-}"
      export REPLICAS=1

      echo "Deploying: $CI_PROJECT_NAME"
      export IMAGE_TAG=$IMAGE_TAG
      export NAMESPACE=personal

      envsubst < k8s/deployment.yaml | kubectl apply -f - || exit 1
      #envsubst < k8s/service.yaml | kubectl apply -f - || exit 1
      #envsubst < k8s/configmap.yaml | kubectl apply -f - || exit 1

      kubectl rollout status deployment/$APP_NAME --timeout=60s -n $NAMESPACE || {
        echo "Deployment failed. Events:"
        kubectl get events --sort-by='.metadata.creationTimestamp'
        exit 1
      }
      exit 0
  only:
    - main

