version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-bot:latest
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - OTEL_ENDPOINT=http://otel-collector.provision.svc.cluster.local:4317
    # Uncomment for debugging
    # ports:
    #   - "9464:9464" # Metrics port if needed
    healthcheck:
      test: ["CMD", "bun", "--version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
